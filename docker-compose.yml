services:
  mysql:
    image: mysql:8.0
    container_name: melo-preda-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: melo_preda
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: melo-preda-app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:root@mysql:3306/melo_preda
      PORT: 3000
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy

  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: melo-preda-evolution
    restart: always
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://app:3000/api/whatsapp/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: "ERROR"
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: melo-preda-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  mysql_data:
